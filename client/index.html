<!-- 📄 index.html

Role: Main SPA container.
Communicates with: app.js

Contains:

Root <div id="app">

HTML templates for:

Login

Register

Recipes screen

CSS imports

Script imports -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe App</title>

    <link rel="stylesheet" href="styles/css/main.css">
    <link rel="stylesheet" href="styles/css/auth.css">
    <link rel="stylesheet" href="styles/css/recipes.css">
    

</head>

<body>
    <header class="main-header">
        <h1>Recipe4you</h1>
        <button id="logoutBtn" class="hidden">Logout</button>
    </header>
    <div id="app"></div>
    <div id="entry-point">
        <h2>Welcome to Recipe4you!</h2>
        <p>Please login or register to continue.</p>
        <button id="login-btn">Login</button>
        <button id="register-btn">Register</button>
    </div>
    <!-- LOGIN TEMPLATE -->
    <template id="login-template">
        <div class="auth-container">
            <form id="loginForm">
                <h2>Login</h2>
                <input id="login-email" type="email" placeholder="Email" required>
                <input id="login-password" type="password" placeholder="Password" required>
                <button type="submit" id="loginBtn">Login</button>
                <p id="login-message"></p>
            </form>
            <div id="register-navigator">
                <p>Don't have an account?</p>
                <button id="goRegister">Register</button>
            </div>
        </div>
    </template>

    <!-- REGISTER TEMPLATE -->
    <template id="register-template">

        <div class="auth-container">
            <form id="registerForm">
                <h2>Register</h2>
                <input id="register-username" placeholder="Name for display" required>
                <input id="register-email" type="email" placeholder="Email" required>
                <input id="register-password" type="password" placeholder="Password" minlength="4" maxlength="10">
                <input type="password" id="register-confirmPassword" minlength="4" placeholder="Confirm password"
                    maxlength="10" required>
                <button type="submit" id="registerBtn">Register</button>
                <p id="register-message"></p>
                <div id="success-login-navigator" class="hidden">
                    <p>go to
                        <button id="goLoginBtn" type="button">Login</button> page
                    </p>
                </div>
            </form>
            <div id="login-navigator">
                <p>Already have an account?</p>
                <button id="goLogin">Login</button>
            </div>
        </div>
    </template>

    <!-- RECIPES TEMPLATE -->
    <template id="recipes-template">
        <div class="recipes-page">

            <header class="recipes-header">
                <h2 id="welcomeMessage"></h2>
            </header>

            <main class="recipes-content">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search recipes by name...">
                </div>
                <button id="openFilterBtn">Filter</button>

                <div id="filterPanel" class="side-panel hidden">
                    <button class="close-btn" id="closeFilterBtn">✖</button>
                    <h3>Filter Recipes</h3>
                    <h4>Categories:</h4>
                    <div id="filterCategories"></div>

                    <label>Prep Time From:</label>
                    <input type="number" id="filterMinTime">

                    <label>To:</label>
                    <input type="number" id="filterMaxTime">

                    <button id="applyFilterBtn">Apply Filter</button>
                </div>
                <button id="openSortBtn">Sort</button>
                <div id="sortPanel" class="side-panel hidden">

                    <button class="close-btn" id="closeSortBtn">✖</button>

                    <h3>Sort Recipes</h3>

                    <h4>Sort By:</h4>

                    <div class="sort-fields">
                        <label>
                            <input type="radio" name="sortField" value="title" checked>
                            Name
                        </label>

                        <label>
                            <input type="radio" name="sortField" value="prepTime">
                            Preparation Time
                        </label>

                        <label>
                            <input type="radio" name="sortField" value="createdAt">
                            Creation Date
                        </label>
                    </div>

                    <h4>Order By:</h4>

                    <div class="sort-order">
                        <label>
                            <input type="radio" name="sortOrder" value="asc" checked>
                            ⬆
                        </label>

                        <label>
                            <input type="radio" name="sortOrder" value="desc">
                            ⬇
                        </label>
                    </div>

                    <button id="applySortBtn">Apply Sort</button>

                </div>

                <button id="resetBtn" class="reset-btn">Reset</button>

                <div id="recipesMessage"></div>

                <div id="recipesContainer" class="recipes-grid"></div>
                <div id="addRecipeOverlay" class="overlay hidden">
                    <div class="modal">

                        <form id="addRecipeForm">

                            <div class="modal-header">
                                <h3 id="form-header">Add New Recipe</h3>
                                <button type="button" id="closeModalBtn">✖</button>
                            </div>

                            <div class="modal-body">
                                <p>(* means required field)</p>
                                <br>
                                <label>Recipe Name *</label>
                                <input type="text" id="recipeTitle" required>
                                <br>
                                <br>
                                <label>Categories</label>
                                <div id="categoriesContainer"></div>
                                <br>
                                <br>
                                <label>Difficulty</label>
                                <select id="recipeDifficulty">
                                    <option value="">Select</option>
                                    <option value="Easy">Easy</option>
                                    <option value="Medium">Medium</option>
                                    <option value="Hard">Hard</option>
                                </select>
                                <br>
                                <br>
                                <label>Preparation Time (minutes)</label>
                                <input type="number" id="recipePrepTime">
                                <br>
                                <br>
                                <label>Ingredients *</label>
                                <div id="ingredientsList"></div>
                                <button type="button" id="addIngredientBtn">+ Add Ingredient</button>
                                <br>
                                <br>
                                <label>Instructions *</label>
                                <textarea id="recipeInstructions" required></textarea>
                                <br>
                                <br>
                                <label>Image URL</label>
                                <input type="url" id="recipeImage">
                                <br>
                                <br>
                                <p id="modalMessage"></p>

                            </div>

                            <div class="modal-footer">
                                <button type="button" id="cancelRecipeBtn">Cancel</button>
                                <button type="submit">Save</button>
                            </div>

                        </form>

                    </div>
                </div>
                <div id="recipeFullOverlay" class="hidden">

                    <div class="recipe-full-container">
                        <button id="fullBackBtn" class="closeModalBtn">✖</button>
                        <div id="recipeFullContent"></div>
                        <div id="recipeFullMessage" class="full-message"></div>

                        <div class="recipe-full-actions">
                            <button id="fullEditBtn">Edit</button>
                            <button id="fullDeleteBtn">Delete</button>

                        </div>

                    </div>

                </div>
            </main>


            <button id="addRecipeBtn" class="floating-add-btn">
                + Add Recipe
            </button>
        </div>
    </template>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>

    <script src="../server/network.js"></script>
    <script src="../server/authServer.js"></script>
    <script src="../server/recipesServer.js"></script>

    <script src="../db/usersDB.js"></script>
    <script src="../db/recipesDB.js"></script>

    <script src="js/fajax.js"></script>
    <script src="js/api.js"></script>

    <script src="js/views/loginView.js"></script>
    <script src="js/views/registerView.js"></script>
    <!-- recipes logic -->
    <script src="js/views/mainRecipesView.js"></script>
    <script src="js/views/addRecipeView.js"></script>
    <script src="js/views/editRecipeView.js"></script>
    <script src="js/views/recipeFullView.js"></script>


</body>

</html>
